<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sillie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Real-time Sign Language Translator</p>
          <h1>Sillie</h1>
          <a href="{{ url_for('app.collect') }}">Collect sign samples</a>
        </div>
      </header>

      <section class="lanes">
        <div class="panel camera-panel">
          <div class="panel-header">
            <h2>Live camera</h2>
              <span class="status-pill">Looking for hands</span>
          </div>
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="prediction-panel" aria-live="polite">
            <p id="prediction-status">Checking for a trained model...</p>
            <p id="current-guess">Waiting for a hand...</p>
            <div
              id="confidence-track"
              class="confidence-track"
              role="progressbar"
              aria-label="Prediction confidence"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="confidence-fill" class="confidence-fill"></div>
            </div>
          </div>
        </div>

        <aside class="panel sidebar-panel">
          <div class="panel-header">
            <h2>Translator</h2>
          </div>
          <div class="transcript-box">
            <p class="label">Detected signs</p>
            <div id="transcript" class="transcript-text">Waiting for input...</div>
            <div class="transcript-actions">
              <button id="clear-button" type="button">Clear</button>
              <button id="undo-button" type="button" disabled>Undo last word</button>
            </div>
          </div>
          <div class="speech-box">
            <div class="toggle-row">
              <label for="auto-speak">Auto-speak</label>
              <input id="auto-speak" type="checkbox" checked />
            </div>
            <button id="speak-button" type="button">Play translated speech</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" defer></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
