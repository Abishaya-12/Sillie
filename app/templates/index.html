<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sillie</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231a1c2c'/%3E%3Cpath d='M3 7h1V5h1V3h2v4h1V1h2v6h1V3h2v5h1v3h-2v2H7v-1H5v-2H4V9H3z' fill='%23ffcd75' stroke='%23f4f4f4' stroke-width='.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PLAYER ONE // SIGN CONSOLE</p>
          <div class="brand-row">
            <svg class="pixel-logo" viewBox="0 0 16 16" role="img" aria-label="Pixel hand">
              <path d="M3 7h1V5h1V3h2v4h1V1h2v6h1V3h2v5h1v3h-2v2H7v-1H5v-2H4V9H3z" fill="#ffcd75" stroke="#1a1c2c" stroke-width=".5" shape-rendering="crispEdges" />
              <path d="M5 8h1v1H5zm4 2h1v1H9z" fill="#ef7d57" shape-rendering="crispEdges" />
            </svg>
            <h1>SILLIE</h1>
          </div>
          <a class="key-link" href="{{ url_for('app.collect') }}">&gt; COLLECT DATA</a>
        </div>
      </header>

      <section class="lanes">
        <div class="panel camera-panel">
          <div class="panel-header">
            <h2>Live camera</h2>
              <span class="status-pill">LOOKING FOR HANDS</span>
          </div>
          <div class="screen">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
          </div>
          <div class="prediction-panel" aria-live="polite">
            <p id="prediction-status">CHECKING FOR A TRAINED MODEL...</p>
            <p id="current-guess">WAITING FOR A HAND...</p>
            <div
              id="confidence-track"
              class="confidence-track"
              role="progressbar"
              aria-label="Prediction confidence"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="confidence-fill" class="confidence-fill"></div>
            </div>
          </div>
        </div>

        <aside class="panel sidebar-panel">
          <div class="panel-header">
            <h2>Translator</h2>
          </div>
          <div class="transcript-box">
            <p class="label">DETECTED SIGNS</p>
            <div id="transcript" class="transcript-text">Waiting for input...</div>
            <div class="transcript-actions">
              <button class="key-danger" id="clear-button" type="button">CLEAR</button>
              <button id="undo-button" type="button">&lt; UNDO</button>
            </div>
          </div>
          <div class="speech-box">
            <div class="toggle-row">
              <label for="auto-speak">AUTO-SPEAK</label>
              <input id="auto-speak" type="checkbox" checked />
            </div>
            <button class="key-primary" id="speak-button" type="button">&gt; PLAY</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" defer></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
