{% extends "base.html" %}

{% block title %}Register | Sillie{% endblock %}

{% block content %}
  <section class="panel auth-panel">
    <div class="panel-header"><h2>CREATE YOUR PLAYER</h2></div>
    <form class="auth-form" action="{{ url_for('auth.register') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label for="username">USERNAME</label>
      <input id="username" name="username" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" value="{{ form_data.get('username', '') if form_data else '' }}" required />
      <label for="display_name">DISPLAY NAME</label>
      <input id="display_name" name="display_name" type="text" maxlength="50" autocomplete="name" value="{{ form_data.get('display_name', '') if form_data else '' }}" required />
      <label for="password">PASSWORD (8+ CHARACTERS)</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
      <label for="confirm_password">CONFIRM PASSWORD</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required />

      <fieldset class="profile-picker">
        <legend>CHOOSE YOUR ACCESSIBILITY PROFILE</legend>
        {% for profile, description in accessibility_profiles.items() %}
          <label class="profile-key" for="profile-{{ profile }}">
            <input id="profile-{{ profile }}" name="accessibility_profile" type="radio" value="{{ profile }}" {% if (form_data.get('accessibility_profile') if form_data else 'hearing') == profile %}checked{% endif %} required />
            <span class="profile-copy"><strong>{{ profile|upper }}</strong><small>{{ description }}</small></span>
          </label>
        {% endfor %}
      </fieldset>
      <button class="key-primary" type="submit">CREATE ACCOUNT</button>
    </form>
    <p class="auth-switch">ALREADY PLAYING? <a href="{{ url_for('auth.login') }}">LOGIN</a></p>
  </section>
{% endblock %}
