<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sillie</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/sillie-logo.png') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="arcade-floaters" aria-hidden="true">
      <span class="arcade-sprite sprite-heart float-a"></span>
      <span class="arcade-sprite sprite-star float-b"></span>
      <span class="arcade-sprite sprite-heart float-c"></span>
      <span class="arcade-sprite sprite-star float-d"></span>
      <span class="arcade-sprite sprite-heart float-e"></span>
      <span class="arcade-sprite sprite-star float-f"></span>
    </div>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PLAYER ONE // SIGN CONSOLE</p>
          <div class="brand-row">
            <img class="pixel-logo" src="{{ url_for('static', filename='images/sillie-logo.png') }}" alt="Sillie pixel cat logo" />
            <h1>SILLIE</h1>
          </div>
          <a class="key-link" href="{{ url_for('app.lobby') }}">&gt; BACK TO LOBBY</a>
        </div>
      </header>

      <section class="lanes">
        <div class="panel camera-panel">
          <div class="panel-header">
            <h2>UNTITLED // CAMERA FEED</h2>
            <span class="status-pill">LOOKING FOR HANDS</span>
            <div class="window-controls" aria-hidden="true">
              <span>_</span>
              <span>□</span>
              <span>×</span>
            </div>
          </div>
          <div class="window-menu" aria-hidden="true">
            <span>File</span><span>Edit</span><span>View</span><span>Image</span>
          </div>
          <div class="screen">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
          </div>
          <div class="prediction-panel" aria-live="polite">
            <p id="prediction-status">CHECKING FOR A TRAINED MODEL...</p>
            <p id="current-guess">WAITING FOR A HAND...</p>
            <div
              id="confidence-track"
              class="confidence-track"
              role="progressbar"
              aria-label="Prediction confidence"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="confidence-fill" class="confidence-fill"></div>
            </div>
            <p id="top-guesses" class="label" aria-live="polite"></p>
          </div>
        </div>

        <aside class="panel sidebar-panel">
          <div class="panel-header">
            <h2>Translator</h2>
          </div>
          <div class="transcript-box">
            <p class="label">DETECTED SIGNS</p>
            <div id="transcript" class="transcript-text">Waiting for input...</div>
            <div class="transcript-actions">
              <button class="key-danger" id="clear-button" type="button">CLEAR</button>
              <button id="undo-button" type="button">&lt; UNDO</button>
            </div>
          </div>
          <div class="speech-box">
            <div class="toggle-row">
              <label for="auto-speak">AUTO-SPEAK</label>
              <input id="auto-speak" type="checkbox" checked />
            </div>
            <button class="key-primary" id="speak-button" type="button">&gt; PLAY</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" defer></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
