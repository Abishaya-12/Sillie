<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collect samples | Sillie</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231a1c2c'/%3E%3Cpath d='M3 7h1V5h1V3h2v4h1V1h2v6h1V3h2v5h1v3h-2v2H7v-1H5v-2H4V9H3z' fill='%23ffcd75' stroke='%23f4f4f4' stroke-width='.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PLAYER TWO // DATA VAULT</p>
          <div class="brand-row">
            <svg class="pixel-logo" viewBox="0 0 16 16" role="img" aria-label="Pixel hand">
              <path d="M3 7h1V5h1V3h2v4h1V1h2v6h1V3h2v5h1v3h-2v2H7v-1H5v-2H4V9H3z" fill="#ffcd75" stroke="#1a1c2c" stroke-width=".5" shape-rendering="crispEdges" />
              <path d="M5 8h1v1H5zm4 2h1v1H9z" fill="#ef7d57" shape-rendering="crispEdges" />
            </svg>
            <h1>SIGN DATA</h1>
          </div>
          <a class="key-link" href="{{ url_for('app.index') }}">&lt; BACK</a>
          <p id="server-status" class="server-status offline" role="status" aria-live="polite">
            <span class="server-status-dot" aria-hidden="true"></span>
            SERVER OFFLINE
          </p>
        </div>
      </header>

      <section class="lanes">
        <div class="panel camera-panel">
          <div class="panel-header">
            <h2>CAMERA FEED</h2>
            <span class="status-pill">LOOKING FOR HANDS</span>
          </div>
          <div class="screen">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
          </div>
        </div>

        <aside class="panel sidebar-panel">
          <div class="panel-header">
            <h2>RECORD DATASET</h2>
          </div>
          <label class="label" for="collector-name">YOUR NAME (OPTIONAL)</label>
          <input id="collector-name" type="text" autocomplete="name" placeholder="ANONYMOUS" />
          <label class="label" for="sign-label">SIGN LABEL</label>
          <input id="sign-label" type="text" autocomplete="off" placeholder="E.G. HELLO" />
          <p class="label">SIT SO YOUR HEAD AND SHOULDERS ARE IN FRAME, SAME DISTANCE EVERY TIME.</p>
          <p class="label">RECORD AN "IDLE" SIGN TOO.</p>
          <div class="speech-box">
            <p class="label">PROGRESS</p>
            <p id="progress" aria-live="polite">0 / 0 TICKS</p>
            <p id="collection-stats" aria-live="polite">0 RECORDINGS / 0 WINDOWS</p>
            <button class="key-danger" id="record-button" type="button">REC</button>
            <button class="key-primary" id="save-button" type="button" disabled>SAVE</button>
            <p id="collection-message" role="status" aria-live="polite"></p>
          </div>
          <div class="speech-box">
            <p class="label">SAVED SAMPLES</p>
            <ul id="summary-list" aria-live="polite">Loading...</ul>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" defer></script>
    <script type="module" src="{{ url_for('static', filename='js/collect.js') }}"></script>
  </body>
</html>
