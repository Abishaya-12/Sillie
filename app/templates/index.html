<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sillie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Real-time Sign Language Translator</p>
          <h1>Sillie</h1>
        </div>
      </header>

      <section class="lanes">
        <div class="panel camera-panel">
          <div class="panel-header">
            <h2>Live camera</h2>
            <span class="status-pill">Awaiting stream</span>
          </div>
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>

        <aside class="panel sidebar-panel">
          <div class="panel-header">
            <h2>Translator</h2>
          </div>
          <div class="transcript-box">
            <p class="label">Detected signs</p>
            <div id="transcript" class="transcript-text">Waiting for input...</div>
          </div>
          <div class="speech-box">
            <p class="label">Speech output</p>
            <button id="speak-button" type="button">Play translated speech</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" defer></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </body>
</html>
